<div id="front"><pre>{{Front}}</pre></div>

<script>
(function () {
  const resources = [
    loadCSS(
      "_katex.css",
      "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.css"
    ),

    loadScript(
      "_highlight.js",
      "https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.0.1/highlight.min.js"
    ),

    loadScript(
      "_katex.min.js",
      "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/katex.min.js"
    ),

    loadScript(
      "_auto-render.js",
      "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/auto-render-cdn.js"
    ),

    loadScript(
      "_markdown-it.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/markdown-it/12.0.4/markdown-it.min.js"
    ),

    loadScript(
      "_markdown-it-mark.js",
      "https://cdn.jsdelivr.net/gh/Jwrede/Anki-KaTeX-Markdown/_markdown-it-mark.js"
    )
  ];

  Promise.all(resources)
    .then(() =>
      loadScript(
        "_mhchem.js",
        "https://cdn.jsdelivr.net/npm/katex@0.12.0/dist/contrib/mhchem.min.js"
      )
    )
    .then(render)
    .catch(function (error) {
      console.error(error);
      show();
    });


  function loadScript(path, fallbackURL) {
    return new Promise((resolve, reject) => {
      const script = document.createElement("script");

      script.onload = resolve;

      script.onerror = function () {
        const fallback = document.createElement("script");

        fallback.onload = resolve;
        fallback.onerror = reject;
        fallback.src = fallbackURL;

        document.head.appendChild(fallback);
      };

      script.src = path;
      document.head.appendChild(script);
    });
  }


  function loadCSS(path, fallbackURL) {
    return new Promise((resolve, reject) => {
      const css = document.createElement("link");

      css.rel = "stylesheet";
      css.type = "text/css";
      css.onload = resolve;

      css.onerror = function () {
        const fallback = document.createElement("link");

        fallback.rel = "stylesheet";
        fallback.type = "text/css";
        fallback.onload = resolve;
        fallback.onerror = reject;
        fallback.href = fallbackURL;

        document.head.appendChild(fallback);
      };

      css.href = path;
      document.head.appendChild(css);
    });
  }


  function render() {
    renderMarkdown("front");
    renderMath("front");
    restoreLiteralDollars("front");
    show();
  }


  function show() {
    const front =
      document.getElementById("front");

    if (front) {
      front.style.visibility = "visible";
    }
  }


  function renderMarkdown(id) {
    const element =
      document.getElementById(id);

    if (!element) return;

    const md = new markdownit({
      typographer: true,
      html: true,

      highlight: function (str, lang) {
        if (lang && hljs.getLanguage(lang)) {
          try {
            return hljs.highlight(str, {
              language: lang
            }).value;
          } catch (_) {}
        }

        return "";
      }
    }).use(markdownItMark);

    const source =
      getMarkdownSource(element);

    const protectedSource =
      protectSpecialContent(source);

    let html =
      md.render(protectedSource.text);

    html = restoreMath(
      html,
      protectedSource.math
    );

    element.innerHTML = html;
  }


  function renderMath(id) {
    const element =
      document.getElementById(id);

    if (!element) return;

    renderMathInElement(element, {
      delimiters: [
        {
          left: "$$",
          right: "$$",
          display: true
        },
        {
          left: "$",
          right: "$",
          display: false
        }
      ],

      ignoredTags: [
        "script",
        "noscript",
        "style",
        "textarea",
        "pre",
        "code"
      ],

      throwOnError: false
    });
  }


  function protectSpecialContent(text) {
    const math = [];
    let output = "";

    let i = 0;

    while (i < text.length) {

      if (text[i] === "`") {
        let tickCount = 1;

        while (
          i + tickCount < text.length &&
          text[i + tickCount] === "`"
        ) {
          tickCount++;
        }

        const marker =
          "`".repeat(tickCount);

        const end = text.indexOf(
          marker,
          i + tickCount
        );

        if (end !== -1) {
          output += text.slice(
            i,
            end + tickCount
          );

          i = end + tickCount;
          continue;
        }
      }


      if (text.substr(i, 3) === "~~~") {
        const end =
          text.indexOf("~~~", i + 3);

        if (end !== -1) {
          output += text.slice(
            i,
            end + 3
          );

          i = end + 3;
          continue;
        }
      }


      if (
        text[i] === "\\" &&
        text[i + 1] === "$"
      ) {
        output +=
          "ANKILITERALDOLLARPLACEHOLDER";

        i += 2;
        continue;
      }


      if (
        text[i] === "$" &&
        text[i + 1] === "$"
      ) {
        const end = findClosingDollar(
          text,
          i + 2,
          true
        );

        if (end !== -1) {
          const expression =
            text.slice(i, end + 2);

          const index = math.length;

          math.push(expression);

          output +=
            "ANKIMATHBLOCK" +
            index +
            "PLACEHOLDER";

          i = end + 2;
          continue;
        }
      }


      if (text[i] === "$") {
        const end = findClosingDollar(
          text,
          i + 1,
          false
        );

        if (end !== -1) {
          const expression =
            text.slice(i, end + 1);

          const index = math.length;

          math.push(expression);

          output +=
            "ANKIMATHINLINE" +
            index +
            "PLACEHOLDER";

          i = end + 1;
          continue;
        }
      }


      output += text[i];
      i++;
    }


    return {
      text: output,
      math: math
    };
  }


  function findClosingDollar(
    text,
    start,
    display
  ) {
    let i = start;

    while (i < text.length) {

      if (text[i] === "\\") {
        i += 2;
        continue;
      }


      if (
        !display &&
        text[i] === "\n"
      ) {
        return -1;
      }


      if (display) {
        if (
          text[i] === "$" &&
          text[i + 1] === "$"
        ) {
          return i;
        }
      } else {
        if (
          text[i] === "$" &&
          text[i + 1] !== "$"
        ) {
          return i;
        }
      }

      i++;
    }

    return -1;
  }


  function restoreMath(html, math) {
    return html.replace(
      /ANKIMATH(?:BLOCK|INLINE)(\d+)PLACEHOLDER/g,
      function (_, index) {
        return escapeHTML(
          math[Number(index)]
        );
      }
    );
  }


  function restoreLiteralDollars(id) {
    const element =
      document.getElementById(id);

    if (!element) return;

    const walker =
      document.createTreeWalker(
        element,
        NodeFilter.SHOW_TEXT
      );

    const nodes = [];

    while (walker.nextNode()) {
      nodes.push(walker.currentNode);
    }

    nodes.forEach(function (node) {
      node.nodeValue =
        node.nodeValue.replace(
          /ANKILITERALDOLLARPLACEHOLDER/g,
          "$"
        );
    });
  }


  function escapeHTML(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }


  function getMarkdownSource(element) {
    let html = element.innerHTML;

    html = html.replace(
      /^<pre[^>]*>/i,
      ""
    );

    html = html.replace(
      /<\/pre>$/i,
      ""
    );

    html = html.replace(
      /<br\s*\/?>/gi,
      "\n"
    );

    html = html.replace(
      /<div[^>]*>/gi,
      ""
    );

    html = html.replace(
      /<\/div>/gi,
      "\n"
    );

    html = html.replace(
      /<\/?span[^>]*>/gi,
      ""
    );

    html = decodeEntities(html);

    html = html.replace(
      /\u00a0/g,
      " "
    );

    return html.trim();
  }


  function decodeEntities(str) {
    const textarea =
      document.createElement("textarea");

    textarea.innerHTML = str;

    return textarea.value;
  }
})();
</script>
<div class="scratchpad-wrapper">

  <div class="scratchpad-label">
    Your answer
  </div>

  <textarea
    id="scratchpad"
    placeholder="Type your code, SQL query, or reasoning here..."
    spellcheck="false"
  ></textarea>

</div>


<script>
(function () {
  const KEY =
    "programming_scratchpad";

  const box =
    document.getElementById("scratchpad");

  if (!box) return;


  sessionStorage.removeItem(KEY);
  box.value = "";


  box.addEventListener(
    "input",
    function () {
      sessionStorage.setItem(
        KEY,
        box.value
      );
    }
  );


  box.addEventListener(
    "keydown",
    function (event) {

      if (event.key !== "Tab") {
        return;
      }

      event.preventDefault();

      const start =
        box.selectionStart;

      const end =
        box.selectionEnd;

      const spaces = "    ";

      box.value =
        box.value.slice(0, start) +
        spaces +
        box.value.slice(end);

      box.selectionStart =
        box.selectionEnd =
        start + spaces.length;

      sessionStorage.setItem(
        KEY,
        box.value
      );
    }
  );
})();
</script>
